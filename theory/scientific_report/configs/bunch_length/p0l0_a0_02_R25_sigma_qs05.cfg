# 2026-10-30, bunch-length test (theory/future_dev/tests/bunch_length/README.md): run B of the progress report
# (config/expansion_a0_scan_server/config_expansion_p0l0_a0_02_R25.cfg) with beam_sigma_z = 1.1116e-4 lambda,
# q_1 sigma_z = 0.5, with q_N = N k_1 + k_L. Only output_folder and beam_sigma_z differ from that config.
#
# 2026-10-29: pure Gaussian pulse (laser_flat_duration 0, wing_sigma 25 cycles, cutoff 4) instead of flat top +
# 5-cycle wings, beam_particle_count 65536 -> 8192, radiation_formula long_distance_direct_approx (was
# long_distance_simplified_approx). Why: theory/future_dev/pulse_envelope_and_lg_normalization.md, numerical_parameters_and_cost.md.
# a0 scan of mode purity, from config_expansion.cfg, 2026-10-28: LG (p,l) = (0,0), a0 = 0.2,
# Server set, 2026-10-29: beam_particle_count 65536 (8x: sampling noise at N = 2), circular_detector_R_max 25 w0 and
# N_R 128 (N_phi 64): screen sized from the R10 runs' fitted modes (99.5% containment angle x ~1.5; the R10 screen
# clipped up to 21% at a0 >= 0.2). Expect ~25-45 min per case on 256 cores.
# circular_detector_R_max = 10 w0, N_R = 256 (N_phi = 64: constant point density; equal-area rings).
#====================================================================
# SIMULATION CONFIGURATION
#======================================================================
output_folder           output_tests/bunch_length  # relative to the home directory
num_threads             0    # 0 = every CPU this process may run on (its affinity mask: under Slurm, the job's allocation); larger values are capped at that count
require_clean_build     false  # true: refuse to run unless the binary was built from a clean git commit (run_log.txt records the commit either way; a dirty build also writes source.patch)
trajectory_NT           100  # number of points per cycle in the electron trajectory
print_particle_trajectory_every_N_particles 10  # the number of trajectory printed for debugging
dense_frequency_spectrum     false # if true, frequencies_list is a fine linear scan from omega_min to omega_max
                                   # (N_omega points) instead of the first N_harmonics harmonics -- intended for a
                                   # detector collapsed to a single point, to resolve a Thomson line's width
omega_min                    0.9 first_harmonic_frequency #the minimum frequency in the computed spectrum; only used when dense_frequency_spectrum=true
omega_max                    1.1 first_harmonic_frequency #only used when dense_frequency_spectrum=true; otherwise the first N_harmonics harmonics are used regardless
# omega_min/omega_max only accept two units: "omega_laser" (value is a raw multiple of the incident
# laser frequency, used as-is) or "first_harmonic_frequency" (value is a multiple of the emitted,
# possibly Doppler-shifted N=1 fundamental -- useful for a relativistic beam where the emitted
# frequency isn't close to any simple multiple of omega_laser).
N_harmonics 2                                # number of harmonics computed; only used when dense_frequency_spectrum=false
N_harmonics_min 1                            # harmonic index the N_harmonics harmonics start at (1 = fundamental); only used when dense_frequency_spectrum=false
N_omega     1000                               # number of points in the fine frequency scan; only used when dense_frequency_spectrum=true

# Which closed form Radiation::compute_radiation evaluates:
# "simplified" (integration-by-parts derivation, velocity field only) or "direct" (direct FT of the
# closed-form Lienard-Wiechert field, needs the electron's stored 4-acceleration), both exact
# (theory/FT_Faraday_tensor-direct_and_simplified_forms-v2.md); or their long-distance approximations
# "long_distance_simplified"/"long_distance_direct" (theory/long_distance_direct_simplified_coding_guide.md), and
# "long_distance_simplified_approx"/"long_distance_direct_approx": the same long-distance formulas with the phase
# factor stepped along tau instead of recomputed (~3-4x faster than long_distance_*, same accuracy).
radiation_formula       long_distance_direct_approx  

#====================================================================
# THE RANDOM SEED
#====================================================================
random_seed             532  # matches Python's electron.seed=42; note the two codebases use different RNGs
                            # (numpy vs std::mt19937), so this gives statistically equivalent, not
                            # bit-identical, electron realizations

# =====================================================================
# DETECTOR CONFIGURATION
# =====================================================================

# Detector's own normal direction, given in the simulation (lab) frame; the detector is built orthogonal
# to this direction. (0.0 pi, 0.0 pi) points the detector along +Oz.
detector_direction_theta  0.0   pi  # baseline: screen and electrons along +Oz, laser along -Oz (head-on)
detector_direction_phi    0.0   pi

# USE THIS FOR A SPHERICAL DETECTOR
#detector_type             spherical
spherical_detector_N_theta          64
spherical_detector_N_phi            64
spherical_detector_radius           25000.0  lambda
spherical_detector_theta_min        0.0   pi
spherical_detector_theta_max        1.0   pi
spherical_detector_phi_min          0.0   pi
spherical_detector_phi_max          2.0   pi
print_detector_type       false

# USE THIS FOR A RECTANGULAR DETECTOR
#detector_type             rectangular
rectangular_detector_x_min             -400.0  lambda
rectangular_detector_x_max              400.0   lambda
rectangular_detector_y_min              -400.0  lambda
rectangular_detector_y_max              400.0   lambda
rectangular_detector_distance           144000.0 lambda
rectangular_detector_Nx                 128
rectangular_detector_Ny                 128
#print_detector_type       true

# USE THIS FOR A CIRCULAR (ANNULUS) DETECTOR -- planar screen at z_local = circular_detector_distance, with
# x = r*cos(phi), y = r*sin(phi), r in [circular_detector_R_min, circular_detector_R_max]
# (circular_detector_N_R points), phi in [0, 2*pi) (circular_detector_N_phi points)
detector_type                          circular
circular_detector_R_min               0.0    lambda
circular_detector_R_max               25 w0  
circular_detector_N_R                 128  
circular_detector_N_phi               64
circular_detector_distance            160000  w0
#print_detector_type       true

plot_detector_scatter      true  # if true, exports the detector's real x/y/z point positions (detector_scatter.dat) to check its position/orientation

# =====================================================================
# LASER FIELD CONFIGURATION
# =====================================================================
# Wave type: "plane_wave" (uniform transverse profile) or "laguerre_gauss" (adds an LG_{p,l} transverse
# mode; requires laser_lg_p/laser_lg_l/laser_lg_w0 below)
# laser_type              plane_wave
laser_type              laguerre_gauss

# Frequency and intensity parameters
laser_frequency         0.004556
laser_direction_theta     1.0  pi  # propagation direction in the lab frame, same (theta, phi) convention as
laser_direction_phi       0.0   pi  # detector_direction_*; (0,0) = +Oz. Only the laser moves: the beam and
                                    # detector keep their own lab-frame geometry. epsilon_1/2 (what zeta_1/2
                                    # refer to) are R x, R y with R the detector's Oz->n rotation (see run_log)
laser_a0                0.2
# duration parameters
laser_flat_duration     0.0 cycles_adim  
laser_wing_sigma        25.0 cycles_adim  
laser_delay             100.0 cycles_adim   #a global shift of the laser pulse in time, in units of cycles; IT NEEDS TO BE laser_wing_sigma * laser_wig_sigma_cutoff for the laser to start at 0 in the origin
laser_NT                100              #points per cycle for the laser-field-vs-phase plot only (export_field_vs_phase); no effect on the physics simulation itself (see trajectory_NT for that)
laser_wing_sigma_cutoff 4  #cutoff of the gaussian pulse: choose between 3,5,6 (maximul for double precision)

#polarization parameters (the laser always propagates along  Oz)
#complex polarization coefficients: E = Real(epsilon_1*zeta_1*amplitude + epsilon_2*zeta_2*amplitude)
#linear along epsilon_1: zeta_1=(1,0), zeta_2=(0,0); circular: zeta_1=(1,0), zeta_2=(0,1)
laser_zeta_1_re          1.0
laser_zeta_1_im          0.0
laser_zeta_2_re          0.0
laser_zeta_2_im          1.0

# Laguerre-Gauss mode parameters -- only read when laser_type = laguerre_gauss
laser_lg_p              0       # radial index (number of radial nodes)
laser_lg_l              0        # azimuthal/OAM index (sets the exp(i*l*phi) vortex phase)
laser_lg_w0             25.0 lambda   # beam waist at the focus

# Heat map of the field intensity (Ex^2+Ey^2+Ez^2) over an x/y grid at z=0 and t =
# laser_wing_sigma_cutoff * laser_wing_sigma / omega -- the actual instant the flat-top plateau begins
# at (note laser_delay above currently has no
# effect on the pulse envelope itself -- CLAUDE.md -- so this deliberately does not use laser_delay).
# For laser_type = plane_wave this heat map is uniform (no transverse profile), so its window is fixed
# to field_heatmap_x/y_min/max below; for laser_type = laguerre_gauss the window is instead sized to
# the mode's own waist (+-2*laser_lg_w0) in main.cpp, and field_heatmap_x/y_min/max are ignored.
plot_field_heatmap       true
field_heatmap_x_min      -30.0 lambda   # only used for laser_type = plane_wave
field_heatmap_x_max       30.0 lambda   # only used for laser_type = plane_wave
field_heatmap_y_min      -30.0 lambda   # only used for laser_type = plane_wave
field_heatmap_y_max       30.0 lambda   # only used for laser_type = plane_wave
field_heatmap_Nx          100
field_heatmap_Ny          100

# =====================================================================
# ELECTRON BEAM PARAMETERS
# =====================================================================
beam_particle_count   65536  
beam_cylinder_radius  -3.0   w0   # < 0 (any value, unit ignored): radius from the LG (p,|l|) table, theory/table of beam electron radius in units of w_0 for different p,l.md; laguerre_gauss only
beam_cylinder_height  0.0   lambda
beam_sigma_z          1.1116e-4  lambda  # q_1 sigma_z = 0.5; any sigma_z > 0 draws the same standard normals (same transverse sample in every run)
beam_center_x         0.0   lambda  # global translation, applied before beam_axis_rotation/laser rotation;
                                    # it is applied before any rotation, so if the goal is to bring the electron beam in the origin only the beam_center_z component should be non-zero
beam_center_y         0.0   lambda
beam_center_z         0.0   lambda
plot_beam_scatter     true  # if true, exports each electron's initial x/y/z position (electron_beam_scatter.dat) to check the beam's position/spread

# =====================================================================
# ELECTRON INITIAL MOMENTUM DISTRIBUTION
# =====================================================================
average_px                     0.0 mc
average_py                     0.0 mc
average_pz                     13.483 mc
sigma_px                       0.0 mc
sigma_py                       0.0 mc
sigma_pz                       0.0 mc



