rectangular_detector_x_min 0.0 w0
rectangular_detector_x_max 44.960 w0
rectangular_detector_y_min 0.0 w0
rectangular_detector_y_max 0.0 w0
rectangular_detector_distance 62419.1 w0
rectangular_detector_Nx 192
rectangular_detector_Ny 1
#print_detector_type       true

# USE THIS FOR A CIRCULAR (ANNULUS) DETECTOR -- planar screen at z_local = circular_detector_distance, with
