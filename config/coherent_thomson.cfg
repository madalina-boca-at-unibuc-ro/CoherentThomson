#====================================================================
# SIMULATION CONFIGURATION
#======================================================================
output_folder           output  #resolved relative to the home directory, i.e. actual runs land in ~/output
num_threads             0    # 0 = use the maximum available hardware threads; values above the hardware maximum also fall back to it
trajectory_NT           100  # number of points per cycle in the electron trajectory
print_particle_trajectory_every_N_particles 10  # the number of trajectory printed for debugging
omega_min                    0.5 omega_laser #the minimum frequency in the computed spectrum
omega_max                    1.5 omega_laser #this is not used in the cirrent implementation; it uses the first 10 harmonics for the given geometry 
                                             #TO be mentioned in CLAUDE.md 
N_omega     3                                # the number of frequencies included in the simuulation
# If true, the exported radiation field is rotated back into the laser's own canonical frame (laser
# along Oz) -- the same frame k1/p/n2 are already evaluated in -- regardless of laser_nx/ny/nz. If
# false, the field is left as computed, in the lab frame (rotated to match laser_nx/ny/nz).
print_field_in_canonical_frame  true
#====================================================================
# THE RANDOM SEED
#====================================================================
random_seed             12345

# =====================================================================
# DETECTOR CONFIGURATION
# =====================================================================

# Detector's own normal direction, given in the canonical frame where the laser propagates along Oz
# (independent of laser_nx/ny/nz); the detector is built orthogonal to this direction and then rotated
# together with the laser's actual direction. (0.0 pi, 0.0 pi) reproduces the old behavior of the detector
# normal exactly matching the laser propagation direction.
detector_direction_theta  1.0   pi
detector_direction_phi    0.0   pi

# USE THIS FOR A SPHERICAL DETECTOR
#detector_type             spherical
spherical_detector_N_theta          20
spherical_detector_N_phi            60
spherical_detector_radius           50000.0  lambda
spherical_detector_theta_min        0.0   pi
spherical_detector_theta_max        0.0016    pi
spherical_detector_phi_min          0.0   pi
spherical_detector_phi_max          2.0   pi
print_detector_type       false

# USE THIS FOR A RECTANGULAR DETECTOR
#detector_type             rectangular
rectangular_detector_x_min             -250.0  lambda
rectangular_detector_x_max              250.0   lambda
rectangular_detector_y_min             -250.0  lambda
rectangular_detector_y_max              250.0   lambda
rectangular_detector_distance           50000.0 lambda
rectangular_detector_Nx                 100
rectangular_detector_Ny                 100
#print_detector_type       true

# USE THIS FOR A CIRCULAR (ANNULUS) DETECTOR -- planar screen at z_local = circular_detector_distance, with
# x = r*cos(phi), y = r*sin(phi), r in [circular_detector_R_min, circular_detector_R_max]
# (circular_detector_N_R points), phi in [0, 2*pi) (circular_detector_N_phi points)
detector_type             circular
circular_detector_R_min               0.0    lambda
circular_detector_R_max              400.0   lambda
circular_detector_N_R                 20
circular_detector_N_phi               60
circular_detector_distance           50000.0 lambda
#print_detector_type       true

plot_detector_scatter      true  # if true, exports the detector's real x/y/z point positions (detector_scatter.dat) to check its position/orientation

# =====================================================================
# LASER FIELD CONFIGURATION
# =====================================================================
# Wave type: "plane_wave" (uniform transverse profile) or "laguerre_gauss" (adds an LG_{p,l} transverse
# mode; requires laser_lg_p/laser_lg_l/laser_lg_w0 below)
# laser_type              plane_wave
laser_type              laguerre_gauss

# Frequency and intensity parameters
laser_frequency         0.057
laser_a0                .10
# duration parameters
laser_flat_duration     10.0 cycles_adim
laser_wing_sigma        5.0  cycles_adim
laser_delay             25.0  cycles_adim   #a global shift of the laser pulse in time, in units of cycles  
laser_NT                100              #the number of points per cycle in the numerical simulation 
laser_wing_sigma_cutoff 5               #cutoff of the gaussian pulse: choose between 3,5,6 (maximul for double precision)       

#direction and polarization parameters
laser_nx                    0.0
laser_ny                    0.0
laser_nz                    1.0
#complex polarization coefficients: E = Real(epsilon_1*zeta_1*amplitude + epsilon_2*zeta_2*amplitude)
#linear along epsilon_1: zeta_1=(1,0), zeta_2=(0,0); circular: zeta_1=(1,0), zeta_2=(0,1)
laser_zeta_1_re          1.0
laser_zeta_1_im          0.0
laser_zeta_2_re          0.0
laser_zeta_2_im          1.0

# Laguerre-Gauss mode parameters -- only read when laser_type = laguerre_gauss
laser_lg_p              0        # radial index (number of radial nodes)
laser_lg_l              1        # azimuthal/OAM index (sets the exp(i*l*phi) vortex phase)
laser_lg_w0             75.0 lambda   # beam waist at the focus

# Heat map of the field intensity (Ex^2+Ey^2+Ez^2) over an x/y grid, in the canonical frame (laser
# along Oz, independent of laser_nx/ny/nz) at z=0 and t = laser_wing_sigma_cutoff * laser_wing_sigma /
# omega -- the actual instant the flat-top plateau begins at (note laser_delay above currently has no
# effect on the pulse envelope itself -- CLAUDE.md -- so this deliberately does not use laser_delay).
# For laser_type = plane_wave this heat map is uniform (no transverse profile), so its window is fixed
# to field_heatmap_x/y_min/max below; for laser_type = laguerre_gauss the window is instead sized to
# the mode's own waist (+-2*laser_lg_w0) in main.cpp, and field_heatmap_x/y_min/max are ignored.
plot_field_heatmap       true
field_heatmap_x_min      -30.0 lambda   # only used for laser_type = plane_wave
field_heatmap_x_max       30.0 lambda   # only used for laser_type = plane_wave
field_heatmap_y_min      -30.0 lambda   # only used for laser_type = plane_wave
field_heatmap_y_max       30.0 lambda   # only used for laser_type = plane_wave
field_heatmap_Nx          100
field_heatmap_Ny          100

# =====================================================================
# ELECTRON BEAM PARAMETERS
# =====================================================================
beam_particle_count   500
beam_cylinder_radius  75   lambda
beam_cylinder_height  0.0   lambda
plot_beam_scatter     true  # if true, exports each electron's initial x/y/z position (electron_beam_scatter.dat) to check the beam's position/spread

# Store the full per-electron trajectory (position/momentum/acceleration vs.
# proper time), reserved upfront from the laser's own phase-grid step count
# (simulation_NT * pulse length in cycles). Leave false for large runs.
store_trajectory      true

# =====================================================================
# ELECTRON INITIAL MOMENTUM DISTRIBUTION
# =====================================================================
average_px                     0.0 mc
average_py                     0.0 mc
average_pz                     0.0 mc
sigma_px                       0.0 mc
sigma_py                       0.0 mc
sigma_pz                       0.0 mc



